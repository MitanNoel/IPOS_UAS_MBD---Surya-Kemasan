version: '3.8'

services:
  web:
    build: .
    container_name: proyekmbd-web
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: db_toko_1
      DB_USERNAME: toko_user
      DB_PASSWORD: toko_password_dev
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    networks:
      - proyekmbd-network
    # Security options for rootless container
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  mysql:
    image: mysql:8.0
    container_name: proyekmbd-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db_toko_1
      MYSQL_USER: toko_user
      MYSQL_PASSWORD: toko_password_dev
    ports:
      - "3306:3306"
    volumes:
      - ./template.sql:/docker-entrypoint-initdb.d/01-init.sql
      - mysql-data:/var/lib/mysql
    networks:
      - proyekmbd-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    # Security options
    security_opt:
      - no-new-privileges:true

networks:
  proyekmbd-network:
    driver: bridge

volumes:
  mysql-data:
